spring.application.name=ai-chatbot

# Machine-specific secrets live here (gitignored). Copy local.properties.example to local.properties.
spring.config.import=optional:file:./local.properties

# ---- LLM + embeddings (Ollama) ----
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.4
spring.ai.ollama.chat.options.num-predict=1024
# Context window: memories + earlier chats + document excerpts + history need more than the default. Lower if RAM is tight.
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.embedding.options.model=${EMBED_MODEL:nomic-embed-text}
# Pull missing models on startup (first run can take a few minutes)
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.embedding.include=true
jwt.secret=eyJhbGciOiJIUzI1NiJ9eyJzdWIiOiJzYW5qYXlAZ21haWwuY29tIiwiaWF0IjoxNzg0MzU2NjgzLCJleHAiOjE3ODQzNjAyODN9fvjXbiohYtrp2hwNOQbvUcKpdGoRFz5CcFnWhh4dDzE

# ---- Vector store (pgvector). Dimensions MUST match the embedding model:
#      nomic-embed-text = 768, mxbai-embed-large = 1024, all-minilm = 384 ----
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_chatbot
spring.datasource.username=postgres
# password comes from local.properties (see below) or the DB_PASSWORD environment variable
spring.datasource.password=yuktha33
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Security ----
# jwt.secret has no default on purpose: the app refuses to start without it.
# Put it in local.properties (gitignored) or set the JWT_SECRET environment variable.
# Generate one with: openssl rand -base64 48

# ---- Uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- App settings ----
app.rag.top-k=4
app.rag.similarity-threshold=0.45
app.rag.chunk-size=500
app.rag.max-documents-per-user=20
app.memory.enabled=true
app.memory.max-per-user=50

# Recall from your OTHER chats (semantic search over past exchanges)
app.recall.enabled=true
app.recall.top-k=3
app.recall.similarity-threshold=0.5
